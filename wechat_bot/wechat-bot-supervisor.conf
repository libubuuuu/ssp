[program:wechat-bot]
command=bash -c "set -a && source /etc/ssp/wechat-bot.env && set +a && exec /root/ssp/wechat_bot/venv/bin/python /root/ssp/wechat_bot/bot.py"
directory=/root/ssp/wechat_bot
user=root
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stderr_logfile=/var/log/wechat-bot.err.log
stdout_logfile=/var/log/wechat-bot.out.log
